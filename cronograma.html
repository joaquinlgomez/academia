<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1b2d">
  <title>Cronograma y Posiciones | Liga de Royal</title>
  <link rel="icon" type="image/png" href="favicon-royal.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0c1b2d;--blue:#173b63;--blue2:#2d5686;--orange:#f58220;--orange2:#ffad55;--ink:#172231;--muted:#5e6b7a;--paper:#fffdf9}
    *{box-sizing:border-box;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;font-family:Montserrat,sans-serif;color:var(--ink);background:#09182a}
    body::before{content:"";position:fixed;inset:0;z-index:-2;background:url('fondo-royal.png') center/cover no-repeat}
    body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(4,13,25,.72),rgba(5,16,29,.58))}
    a{color:inherit}

    
    .topbar{background:rgba(8,20,35,.94);backdrop-filter:blur(12px);border-bottom:1px solid #ffffff20;color:#fff}
    .topbar-inner{max-width:1180px;margin:auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:900;letter-spacing:.02em}
    .brand img{width:52px;height:52px;object-fit:contain}
    .brand span{display:block;font-size:1rem;line-height:1.1}
    .brand small{display:block;color:#ffb36b;font-size:.65rem;letter-spacing:.19em;margin-top:5px}
    .back-link{display:inline-flex;align-items:center;gap:8px;color:#e5edf7;text-decoration:none;border:1px solid #ffffff4d;padding:10px 14px;border-radius:5px;font-size:.82rem;font-weight:800}
    .back-link:hover{background:#ffffff16;color:#fff}
    .page{max-width:1180px;margin:0 auto;padding:32px 22px 58px}

    .hero{padding:clamp(26px,5vw,40px);background:linear-gradient(115deg,rgba(24,61,101,.97),rgba(9,25,44,.96));border:1px solid #ffffff2c;box-shadow:0 24px 60px #0004;color:#fff;text-align:center;margin-bottom:20px}
    .hero h1{font-size:clamp(2rem,4vw,3.5rem);letter-spacing:-.05em;line-height:1;margin:0;font-weight:1000;text-transform:uppercase}
    .hero p{color:#ffb76e;font-weight:900;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;margin:10px 0 0}

    .content-grid{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
    
    
    .panel-iframe{background:rgba(255,253,249,.97);border:1px solid #ffffffa8;box-shadow:0 15px 38px #08172926;border-radius:6px;overflow:hidden; height: 85vh; min-height: 700px; display: flex; flex-direction: column;}
    .iframe-container{flex-grow: 1; width: 100%; border: none;}

    @media(max-width:620px){
        .topbar-inner{padding:10px 15px}
        .brand img{width:43px;height:43px}
        .brand span{font-size:.84rem}
        .brand small{font-size:.56rem}
        .back-link{font-size:0;padding:11px}
        .back-link::after{content:"Volver";font-size:.78rem}
        .page{padding:18px 13px 40px}
        .hero{padding:25px 20px}
        .panel-iframe{height: 90vh;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><img src="logo-royal.png" alt="Royal Star’s Club"><span>ROYAL STAR’S CLUB<small>LIGA DE PÁDEL</small></span></a>
      <a class="back-link" href="index.html">← Volver al inicio</a>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Cronograma y Posiciones</h1>
      <p>Gestiona tus partidos y revisa las tablas desde nuestro sistema oficial.</p>
    </section>

    <div class="content-grid">
      
      <!-- BANNER DE padelrank -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 15px; background: rgba(255,253,249,.03); border: 1px solid #ffffff1a; padding: 12px 20px; border-radius: 6px; margin-bottom: -5px;">
        <span style="color: var(--muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;">Tecnología impulsada por</span>
        <img src="padelrank_logo.png" alt="Logo Padelrank" style="height: 35px; object-fit: contain;">
      </div>

      <!-- CONTENEDOR DEL SISTEMA EXTERNO (PADELRANK) -->
      <section class="panel-iframe">
        
        
        <iframe 
          class="iframe-container" 
          src="https://www.padelrank.club/torneo/96" 
          title="Sistema de Liga Padelrank"
          allowfullscreen>
        </iframe>

      </section>
    </div>
  </main>
</body>
</html>
